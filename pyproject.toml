[project]
name = "redagent"
version = "0.1.0"
description = "2-Stage Laya-Powered Crypto Options Decision & Trading Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.2.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "laya>=0.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.29.0",
    "peft>=0.10.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
